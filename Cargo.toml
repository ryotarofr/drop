[package]
name = "drop"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.16.1", features = ["backend-winit", "renderer-skia", "raw-window-handle-06"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
global-hotkey = "0.8.0"
tray-icon = "0.24.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10.1"
regex = "1"
once_cell = "1"
anyhow = "1"
dirs = "6.0.0"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
